services:
  - type: web
    name: medpulse-hospital-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_MODE
        value: mongo
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ENABLE_DEMO_OTP
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: hospital_management_db
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
